<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KHTN Math Trainer</title>
  <style>
    :root{--bg:#080d1a;--side:#0d1425;--card:#121c31;--card2:#17243d;--line:#293957;--text:#f5f7ff;--muted:#96a5c3;--purple:#786cff;--green:#40d99b;--yellow:#f7c858;--red:#ff7187}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% -20%,#202159 0,transparent 42%),var(--bg);color:var(--text);font:14px "Segoe UI",Arial,sans-serif;height:100vh;overflow:hidden}
    button,textarea{font:inherit}.app{display:grid;grid-template-columns:300px 1fr;height:100vh}.side{background:rgba(13,20,37,.94);border-right:1px solid #1e2b44;padding:25px 16px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:12px;padding:0 8px 20px}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,#8c82ff,#6558ef);display:grid;place-items:center;font-size:21px;font-weight:800;box-shadow:0 10px 28px #6659ef55}.brand b{font-size:19px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:1.2px;margin-top:4px}.cap{color:var(--muted);font-size:10px;font-weight:700;letter-spacing:1.2px;padding:0 10px 9px}.lesson{width:100%;border:0;background:transparent;color:#cdd6eb;border-radius:12px;padding:14px 12px;text-align:left;margin:3px 0;cursor:pointer;display:grid;grid-template-columns:34px 1fr;align-items:center;transition:.18s}.lesson:hover{background:#16233a;transform:translateX(2px)}.lesson.active{background:linear-gradient(90deg,#242857,#192542);color:white;box-shadow:inset 3px 0 var(--purple)}.num{color:#8290ad;font-weight:700}.sidefoot{margin-top:auto;background:#131e33;border:1px solid #22314d;border-radius:14px;padding:14px}.online{color:var(--green);font-size:11px;font-weight:800}.sidefoot p{color:var(--muted);line-height:1.5;margin:7px 0 0;font-size:12px}
    main{overflow:auto;padding:30px 42px 44px}.top{display:flex;justify-content:space-between;align-items:flex-start;max-width:980px;margin:auto}.eyebrow{color:#9187ff;font-size:11px;font-weight:800;letter-spacing:1.3px}.top h1{font-size:30px;margin:5px 0 15px;letter-spacing:-.6px}.streak{background:#131e33;border:1px solid #273653;border-radius:12px;padding:10px 15px;color:#dbe2f3}.streak b{color:var(--yellow)}.progressrow{max-width:980px;margin:0 auto 17px;display:flex;align-items:center;gap:14px}.bar{height:8px;background:#1a2740;border-radius:99px;overflow:hidden;flex:1}.fill{height:100%;width:0;background:linear-gradient(90deg,#675af2,#9d75ff);border-radius:99px;transition:.35s}.progressrow span{font-size:11px;color:var(--muted);font-weight:700}
    .workspace{max-width:980px;margin:auto;background:linear-gradient(145deg,rgba(20,31,53,.98),rgba(15,24,42,.98));border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 22px 70px #0007}.problem{background:linear-gradient(120deg,#182640,#151f37);border:1px solid #293a5c;border-radius:15px;padding:17px 19px}.tag{font-size:10px;color:#978dff;font-weight:800;letter-spacing:1.3px}.problem h2{font-size:18px;line-height:1.55;margin:6px 0;color:#fff;white-space:pre-line}.goal{color:var(--muted);font-size:12px}.goal b{color:#c8d1e6}.toolbar{display:flex;align-items:center;justify-content:space-between;margin:15px 1px 10px}.switch{display:flex;background:#0c1527;border:1px solid #263652;padding:4px;border-radius:11px}.switch button{border:0;color:#9facC6;background:transparent;padding:8px 14px;border-radius:8px;cursor:pointer}.switch button.on{background:var(--purple);color:#fff;box-shadow:0 5px 15px #6457ef55}.note{color:var(--muted);font-size:11px}.prompt{font-weight:700;font-size:14px;margin:10px 2px}.prompt span{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:8px;background:#2a2d62;color:#a99fff;margin-right:7px}.answer{width:100%;height:112px;resize:none;background:#0b1425;color:white;border:1px solid #2b3d5e;border-radius:13px;padding:15px 16px;outline:0;font-size:15px;line-height:1.55;transition:.2s}.answer:focus{border-color:#7469fa;box-shadow:0 0 0 3px #7469fa22}.actions{display:flex;gap:8px;margin:12px 0}.btn{border:1px solid #2b3c5b;background:#192640;color:#e8edfa;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;transition:.17s}.btn:hover{background:#243553;transform:translateY(-1px)}.btn.primary{background:linear-gradient(135deg,#8175ff,#6659ef);border:0;padding:11px 18px;box-shadow:0 8px 20px #5d50e94a}.btn.right{margin-left:auto}.feedback{display:flex;gap:11px;background:#17243c;border-radius:12px;padding:13px 15px;color:var(--muted);line-height:1.5;min-height:48px}.dot{color:#8d82ff;font-size:18px}.feedback.good,.feedback.good .dot{color:var(--green)}.feedback.warn,.feedback.warn .dot{color:var(--yellow)}.feedback.bad,.feedback.bad .dot{color:var(--red)}
    .toast{position:fixed;right:28px;bottom:25px;background:#182640;border:1px solid #34466a;padding:13px 17px;border-radius:12px;box-shadow:0 14px 40px #0008;transform:translateY(80px);opacity:0;transition:.3s}.toast.show{transform:none;opacity:1}@media(max-width:1100px){.app{grid-template-columns:245px 1fr}main{padding:25px}.note{display:none}}
    #lessons{overflow:auto;min-height:0;padding-right:4px}#lessons::-webkit-scrollbar{width:5px}#lessons::-webkit-scrollbar-thumb{background:#344463;border-radius:8px}.dash{max-width:980px;margin:0 auto 15px;display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{background:#111b2e;border:1px solid #21314e;border-radius:12px;padding:11px 13px}.stat span{display:block;color:#7786a2;font-size:9px;font-weight:800;letter-spacing:1px}.stat b{display:block;font-size:18px;margin-top:4px}.topActions{display:flex;gap:8px;align-items:center}.random{border:1px solid #354664;background:#18253d;color:#f7c858;border-radius:10px;padding:9px 12px;cursor:pointer}.random:hover{background:#223451}
  </style>
</head>
<body><div class="app">
  <aside class="side"><div class="brand"><div class="logo">K</div><div><b>KHTN Math</b><small>TRAINER • V1.0 POWER</small></div></div><div class="cap">12 BÀI • 4 CHUYÊN ĐỀ</div><div id="lessons"></div><div class="sidefoot"><div class="online">● HỌC OFFLINE</div><p>Không cần mạng. Tiến độ được lưu riêng trên máy.</p></div></aside>
  <main><div class="top"><div><div id="source" class="eyebrow"></div><h1 id="title"></h1></div><div class="topActions"><button class="random" id="random">⚡ Bài ngẫu nhiên</button><div class="streak">🔥 Chuỗi học: <b>1 ngày</b></div></div></div><div class="dash"><div class="stat"><span>XP</span><b id="xp">0</b></div><div class="stat"><span>ĐỘ CHÍNH XÁC</span><b id="accuracy">0%</b></div><div class="stat"><span>ĐÃ XONG</span><b id="done">0/12</b></div><div class="stat"><span>LEVEL</span><b id="level">1</b></div></div><div class="progressrow"><div class="bar"><div id="fill" class="fill"></div></div><span id="progress"></span></div>
  <section class="workspace"><div class="problem"><div class="tag">ĐỀ BÀI</div><h2 id="problem"></h2><div id="goal" class="goal"></div></div><div class="toolbar"><div class="switch"><button id="quick" class="on">Nháp nhanh</button><button id="official">Trình bày đi thi</button></div><div id="note" class="note">Có thể viết: chc, ntc, scp…</div></div><div id="prompt" class="prompt"></div><textarea id="answer" class="answer" placeholder="Viết bước giải của bạn ở đây…"></textarea><div class="actions"><button id="check" class="btn primary">Kiểm tra bước →</button><button id="hint" class="btn">Gợi ý nhẹ</button><button id="understand" class="btn">App hiểu gì?</button><button id="standard" class="btn right">Câu chuẩn</button></div><div id="feedback" class="feedback"><div class="dot">●</div><div id="feedbackText">Cứ viết theo cách bạn đang nghĩ. App sẽ kiểm tra từng bước.</div></div></section></main>
</div><div id="toast" class="toast">Đã lưu tiến độ ✓</div>
<script>
const P=[{source:'LUYỆN NỀN • PHƯƠNG TRÌNH NGHIỆM NGUYÊN',title:'Tạo phương trình ước số',problem:'Tìm các cặp số nguyên (x, y) thỏa mãn:\nxy + 2x + 3y = 7.',goal:'Thêm bớt để đưa phương trình về dạng tích bằng một hằng số.',steps:[['Biến đổi phương trình thành một tích.','(x+3)(y+2)=13','So sánh với (x + 3)(y + 2).','Ta có xy + 2x + 3y = 7 ⇔ (x + 3)(y + 2) = 13.'],['Nêu đủ các cặp giá trị của hai thừa số.','1,13;13,1;-1,-13;-13,-1','Đừng quên các ước âm của 13.','Vì x, y nguyên nên (x + 3, y + 2) ∈ {(1,13),(13,1),(-1,-13),(-13,-1)}.'],['Kết luận tất cả nghiệm.','-2,11;10,-1;-4,-15;-16,-3','Trừ lần lượt 3 và 2.','Vậy nghiệm là (-2,11), (10,-1), (-4,-15), (-16,-3).']]},{source:'KHTN 2019 • SỐ HỌC',title:'Chia hết để giới hạn ẩn',problem:'Tìm (x, y) nguyên thỏa mãn:\n(x² − x + 1)(y² + xy) = 3x − 1.',goal:'Dùng chia hết để khóa x trước, rồi mới tìm y.',steps:[['Suy ra quan hệ chia hết đầu tiên.','x^2-x+1|3x-1','Nhìn nhân tử ở vế trái.','Từ phương trình suy ra x² − x + 1 chia hết cho 3x − 1.'],['Tìm hằng số mà x² − x + 1 là ước.','x^2-x+1|7','Dùng (3x−1)(3x−2).','Vì (3x−1)(3x−2)=9(x²−x+1)−7 nên x²−x+1 chia hết cho 7.'],['Tìm các giá trị có thể của x.','-2,0,1,3','Biểu thức luôn dương, chỉ có thể bằng 1 hoặc 7.','Suy ra x ∈ {−2,0,1,3}.'],['Thử lại và kết luận nghiệm.','1,1;1,-2;-2,1','Thay từng x vào phương trình.','Các nghiệm là (1,1), (1,−2), (−2,1).']]},{source:'KỸ NĂNG • NGÔN NGỮ TOÁN',title:'Viết một ý theo hai cách',problem:'Cho a, b nguyên dương nguyên tố cùng nhau và ab là số chính phương. Nêu kết luận.',goal:'Chuyển linh hoạt giữa bản nháp và bản trình bày chính thức.',steps:[['Bạn kết luận được gì về a và b?','a,b đều là số chính phương','Xét số mũ nguyên tố trong a và b.','Vì a và b nguyên tố cùng nhau và ab là số chính phương nên a, b đều là số chính phương.']]}];
P.push(
{source:'KHTN STYLE • PT NGHIỆM NGUYÊN',title:'Phân tích nhân tử không mò',problem:'Tìm x, y nguyên:\nxy − 2x + 3y = 11.',goal:'Nhận ra cấu trúc tích từ ba hạng tử.',steps:[['Đưa phương trình về dạng tích.','x+3;y-2;5','Thử khai triển (x + 3)(y − 2).','Ta có xy − 2x + 3y = 11 ⇔ (x + 3)(y − 2) = 5.'],['Liệt kê đủ các cặp thừa số.','1,5;5,1;-1,-5;-5,-1','Nhớ xét cả các ước âm của 5.','(x+3,y−2) ∈ {(1,5),(5,1),(−1,−5),(−5,−1)}.']]},
{source:'SỞ STYLE • PT NGHIỆM NGUYÊN',title:'Hiệu hai bình phương',problem:'Tìm x, y nguyên:\nx² − y² = 45.',goal:'Kết hợp phân tích nhân tử và tính chẵn lẻ.',steps:[['Phân tích vế trái.','x-y;x+y;45','Dùng hằng đẳng thức hiệu hai bình phương.','Ta có (x − y)(x + y) = 45.'],['Nêu điều kiện của hai thừa số.','cùng;lẻ','Vì tích là số lẻ, hãy xét tính chẵn lẻ.','Hai thừa số x−y và x+y đều là số lẻ.']]},
{source:'SỐ HỌC • ĐỒNG DƯ',title:'Số chính phương modulo 8',problem:'Chứng minh bình phương của một số lẻ luôn chia 8 dư 1.',goal:'Đặt số lẻ tổng quát rồi khai triển.',steps:[['Đặt số lẻ dưới dạng tổng quát.','2k+1','Số lẻ hơn một số chẵn đúng 1 đơn vị.','Đặt n = 2k + 1 với k nguyên.'],['Khai triển thành dạng chia 8 dư 1.','4k(k+1)+1','Hãy nhóm 4k² + 4k.','n² = 4k(k+1) + 1. Vì k(k+1) chẵn nên n² chia 8 dư 1.']]},
{source:'KHTN STYLE • SỐ HỌC',title:'Ước chung ẩn',problem:'Tính gcd(y + 1, y² + y + 1), với y nguyên.',goal:'Trừ bội để hạ bậc và tạo phần dư.',steps:[['Tạo một tổ hợp bằng 1.','y^2+y+1-y(y+1)=1','Lấy biểu thức bậc hai trừ y lần biểu thức bậc nhất.','Ta có y²+y+1 − y(y+1) = 1.'],['Kết luận ước chung lớn nhất.','gcd;1','Mọi ước chung đều phải là ước của 1.','Vậy gcd(y+1, y²+y+1) = 1.']]},
{source:'BĐT NỀN • ĐIỂM RƠI',title:'Tích hai biến',problem:'Cho a, b > 0 và a + b = 6. Tìm GTLN của ab.',goal:'Đánh giá và khóa chặt điều kiện dấu bằng.',steps:[['Đánh giá tích ab.','ab;9','Dùng (a − b)² ≥ 0 hoặc AM-GM.','Ta có 4ab ≤ (a+b)² = 36, suy ra ab ≤ 9.'],['Nêu GTLN và dấu bằng.','9;a=b=3','Dấu bằng xảy ra khi a = b.','Vậy GTLN của ab là 9, đạt khi a=b=3.']]},
{source:'KHTN STYLE • BẤT ĐẲNG THỨC',title:'Xé mảnh AM-GM',problem:'Cho a,b,c>0, a+b+c=6. Tìm GTLN của (a+b)c.',goal:'Gom a+b thành một khối để về hai biến.',steps:[['Đặt ẩn phụ thích hợp.','t=a+b;t+c=6','Biểu thức chỉ nhìn thấy a+b như một khối.','Đặt t=a+b>0, khi đó t+c=6.'],['Đánh giá tc.','tc;9','Hai số dương t,c có tổng bằng 6.','Ta có tc ≤ (t+c)²/4 = 9. Vậy GTLN bằng 9.']]},
{source:'CHUYÊN KHTN • BẤT ĐẲNG THỨC',title:'Ba tích đối xứng',problem:'Cho a,b,c>0 và abc=1. Chứng minh:\n(a+b)(b+c)(c+a) ≥ 8.',goal:'AM-GM trực tiếp trên từng ngoặc.',steps:[['Đánh giá ba tổng.','a+b;b+c;c+a;2','Áp dụng u+v ≥ 2√uv cho từng ngoặc.','a+b≥2√ab, b+c≥2√bc, c+a≥2√ca.'],['Nhân các đánh giá và kết luận.','8abc;8','Các vế đều dương, sau đó dùng abc=1.','(a+b)(b+c)(c+a) ≥ 8abc = 8.']]},
{source:'SỐ HỌC • SỐ CHÍNH PHƯƠNG',title:'Tách tích nguyên tố cùng nhau',problem:'Cho a,b nguyên dương, gcd(a,b)=1 và ab là SCP. Chứng minh a,b đều là SCP.',goal:'Dùng số mũ trong phân tích thừa số nguyên tố.',steps:[['Nêu ý nghĩa của gcd(a,b)=1.','không;cùng;nguyên tố','Mỗi thừa số nguyên tố chỉ xuất hiện ở một phía.','a và b không có thừa số nguyên tố chung.'],['Kết luận về a và b.','a;b;scp','Số mũ của mọi nguyên tố trong ab đều chẵn.','Do các số mũ không trộn giữa a,b và đều chẵn nên a,b đều là SCP.']]},
{source:'KỸ NĂNG • TRÌNH BÀY',title:'Khóa điều kiện dấu bằng',problem:'Đã chứng minh S ≤ 9 và dấu bằng tại a=b=3. Hãy viết kết luận chuẩn.',goal:'Kết luận đủ đại lượng, giá trị và điều kiện đạt.',steps:[['Viết kết luận cuối bài.','gtln;9;a=b=3','Một kết luận chuẩn phải có: đại lượng, giá trị, điều kiện đạt.','Vậy GTLN của S là 9, đạt được khi a=b=3.']]}
);
let pi=0,si=0,mode='quick',hintLevel=0;const $=x=>document.getElementById(x),norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replaceAll('²','^2').replace(/[−–—]/g,'-').replace(/\s/g,'').replaceAll('chiahetcho','|').replaceAll('chc','|').replaceAll('⋮','|').replaceAll('sochinhphuong','scp').replaceAll('nguyentocungnhau','ntc');
function renderLessons(){ $('lessons').innerHTML=P.map((p,i)=>`<button class="lesson ${i===pi?'active':''}" onclick="load(${i})"><span class="num">0${i+1}</span><span>${p.title}</span></button>`).join('') }
function saved(){return JSON.parse(localStorage.getItem('khtn-progress')||'{}')}function save(){let s=saved();s[pi]=Math.max(s[pi]||0,si);localStorage.setItem('khtn-progress',JSON.stringify(s));$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1200)}
function load(i){pi=i;si=Math.min(saved()[i]||0,P[i].steps.length-1);render();renderLessons()}function render(){let p=P[pi],s=p.steps[si];$('source').textContent=p.source;$('title').textContent=p.title;$('problem').textContent=p.problem;$('goal').innerHTML='<b>Mục tiêu:</b> '+p.goal;$('prompt').innerHTML=`<span>${si+1}</span>${s[0]}`;$('answer').value='';$('fill').style.width=(si/p.steps.length*100)+'%';$('progress').textContent=`${si}/${p.steps.length} bước hoàn thành`;feedback('Cứ viết theo cách bạn đang nghĩ. App sẽ kiểm tra từng bước.','')}
function feedback(t,c){$('feedbackText').textContent=t;$('feedback').className='feedback '+c}function correct(a,key){let x=norm(a),k=norm(key);if(k.includes(';'))return k.split(';').every(z=>x.includes(z));if(pi===2)return x.includes('a')&&x.includes('b')&&(x.includes('scp')||x.includes('chínhphương'));return x.includes(k)}
$('check').onclick=()=>{let a=$('answer').value.trim(),s=P[pi].steps[si];if(!a)return feedback('Bạn chưa nhập bước giải. Nếu kẹt, hãy bấm “Gợi ý nhẹ”.','warn');if(!correct(a,s[1]))return feedback('App chưa xác nhận được bước này. Hãy kiểm tra dấu, giá trị còn thiếu hoặc xem gợi ý.','bad');if(si<P[pi].steps.length-1){feedback('Đúng rồi ✓  '+s[3],'good');si++;save();setTimeout(render,950)}else{$('fill').style.width='100%';$('progress').textContent=`${P[pi].steps.length}/${P[pi].steps.length} bước hoàn thành`;save();feedback('Hoàn thành bài! Bạn đã đi hết đường giải, không chỉ tìm đáp số.','good')}};
$('hint').onclick=()=>feedback('Gợi ý nhẹ: '+P[pi].steps[si][2],'warn');$('standard').onclick=()=>feedback('Cách trình bày đi thi: '+P[pi].steps[si][3],'');$('understand').onclick=()=>{let a=norm($('answer').value);feedback(a.includes('|')?'App hiểu: bạn đang nêu một quan hệ chia hết.':a.includes('=')?'App hiểu: bạn đang biến đổi hoặc đưa ra giá trị của ẩn.':'App hiểu: bạn đang trình bày một lập luận bằng lời.','warn')};
function setMode(m){mode=m;$('quick').classList.toggle('on',m==='quick');$('official').classList.toggle('on',m==='official');$('note').textContent=m==='quick'?'Có thể viết: chc, ntc, scp, ⋮…':'Viết đầy đủ như trong bài kiểm tra'}
function getStats(){return JSON.parse(localStorage.getItem('khtn-stats')||'{"xp":0,"tries":0,"right":0,"done":[]}')}
function putStats(s){localStorage.setItem('khtn-stats',JSON.stringify(s));showStats()}
function showStats(){let s=getStats();$('xp').textContent=s.xp;$('accuracy').textContent=s.tries?Math.round(s.right/s.tries*100)+'%':'0%';$('done').textContent=s.done.length+'/'+P.length;$('level').textContent=Math.floor(s.xp/200)+1}
const rawCheck=$('check').onclick;$('check').onclick=()=>{let before=$('feedback').className,s=getStats();s.tries++;rawCheck();if($('feedback').classList.contains('good')&&$('feedback').className!==before){s.right++;s.xp+=20;if($('progress').textContent.startsWith(P[pi].steps.length+'/')){if(!s.done.includes(pi))s.done.push(pi);s.xp+=50}}putStats(s)}
const rawLoad=load;load=i=>{hintLevel=0;rawLoad(i)}
$('hint').onclick=()=>{hintLevel=hintLevel%3+1;let s=P[pi].steps[si],messages=['Tầng 1 • Nhìn mục tiêu: '+P[pi].goal,'Tầng 2 • Mấu chốt: '+s[2],'Tầng 3 • Khung lời giải: Hãy bắt đầu bằng “Ta có …”, rồi suy ra đúng điều bước này yêu cầu.'];feedback(messages[hintLevel-1]+'  ['+hintLevel+'/3]','warn')}
$('random').onclick=()=>load(Math.floor(Math.random()*P.length));
$('quick').onclick=()=>setMode('quick');$('official').onclick=()=>setMode('official');$('answer').addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter')$('check').click()});renderLessons();render();showStats();
</script></body></html>
