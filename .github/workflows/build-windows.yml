name: Build Windows demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run tests
        run: python -m unittest -v
      - name: Build portable EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --add-data "web;web" --name KHTN-Math-Trainer-Demo desktop.py
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: KHTN-Math-Trainer-Demo-Windows
          path: dist/KHTN-Math-Trainer-Demo.exe
      - name: Attach EXE to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KHTN-Math-Trainer-Demo.exe
